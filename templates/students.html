{% extends "base.html" %}{% block content %}
<div class="head"><h1>Student Management</h1><a class="button" href="{{url_for('add_student')}}">+ Add Student</a></div>
<div class="panel"><table><tr><th>UID</th><th>Name</th><th>Registered</th><th>Actions</th></tr>
{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.name}}</td><td>{{s.created_at}}</td><td class="actions">
<a class="small" href="{{url_for('edit_student',sid=s.id)}}">Edit</a>
<form method="post" action="{{url_for('delete_student',sid=s.id)}}" onsubmit="return confirm('Are you sure you want to delete this student?')"><button class="dangerbtn">Delete</button></form>
</td></tr>{% else %}<tr><td colspan="4">No students registered.</td></tr>{% endfor %}</table></div>
{% endblock %}
